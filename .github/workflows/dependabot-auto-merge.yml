name: Dependabot auto-merge

on:
  pull_request:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event.check_suite.pull_requests[0] != null
    steps:
      - name: Merge if checks passed
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url || github.event.check_suite.pull_requests[0].html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

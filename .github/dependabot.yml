version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      weekly-updates:
        applies-to: "version-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
      security-updates:
        applies-to: "security-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
